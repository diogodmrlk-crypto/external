
name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - html-to-ts-generator

permissions:
  contents: read

jobs:
  build:
    name: Compile native iOS project
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Find Xcode project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          WORKSPACE=$(find . -maxdepth 3 -name "*.xcworkspace" \
            -not -path "*/Pods/*" | head -n 1)
          PROJECT=$(find . -maxdepth 3 -name "*.xcodeproj" \
            -not -path "*/Pods/*" | head -n 1)

          if [ -n "$WORKSPACE" ]; then
            echo "type=workspace" >> "$GITHUB_OUTPUT"
            echo "path=$WORKSPACE" >> "$GITHUB_OUTPUT"
            echo "name=$(basename "$WORKSPACE" .xcworkspace)" >> "$GITHUB_OUTPUT"
          elif [ -n "$PROJECT" ]; then
            echo "type=project" >> "$GITHUB_OUTPUT"
            echo "path=$PROJECT" >> "$GITHUB_OUTPUT"
            echo "name=$(basename "$PROJECT" .xcodeproj)" >> "$GITHUB_OUTPUT"
          else
            echo "::error::No .xcodeproj or .xcworkspace found."
            echo "This workflow requires an existing native Xcode project."
            exit 1
          fi

      - name: Install CocoaPods dependencies
        shell: bash
        run: |
          if [ -f Podfile ]; then
            sudo gem install cocoapods
            pod install
          fi

      - name: List schemes
        shell: bash
        run: |
          if [ "${{ steps.project.outputs.type }}" = "workspace" ]; then
            xcodebuild -list -workspace "${{ steps.project.outputs.path }}"
          else
            xcodebuild -list -project "${{ steps.project.outputs.path }}"
          fi

      - name: Build unsigned app
        shell: bash
        run: |
          set -o pipefail

          if [ "${{ steps.project.outputs.type }}" = "workspace" ]; then
            xcodebuild \
              -workspace "${{ steps.project.outputs.path }}" \
              -scheme "${{ steps.project.outputs.name }}" \
              -configuration Release \
              -sdk iphoneos \
              -derivedDataPath build \
              CODE_SIGNING_ALLOWED=NO \
              build
          else
            xcodebuild \
              -project "${{ steps.project.outputs.path }}" \
              -scheme "${{ steps.project.outputs.name }}" \
              -configuration Release \
              -sdk iphoneos \
              -derivedDataPath build \
              CODE_SIGNING_ALLOWED=NO \
              build
          fi

      - name: Package IPA
        shell: bash
        run: |
          set -euo pipefail

          APP=$(find build/Build/Products/Release-iphoneos \
            -maxdepth 1 -name "*.app" -type d | head -n 1)

          if [ -z "$APP" ]; then
            echo "::error::Build completed without producing an .app."
            exit 1
          fi

          mkdir -p dist/Payload
          cp -R "$APP" dist/Payload/
          cd dist
          zip -qry app-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-unsigned-ipa
          path: dist/app-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
