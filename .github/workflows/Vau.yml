      - name: Diagnosticar e localizar artefatos
        shell: bash
        run: |
          echo "Arquivos gerados pelo Theos:"
          find . -type f \( \
            -name "*.ipa" -o \
            -name "*.deb" -o \
            -name "*.dylib" \
          \) -not -path "./.git/*" -print

          mkdir -p dist

          find . -type f \( \
            -name "*.ipa" -o \
            -name "*.deb" -o \
            -name "*.dylib" \
          \) \
            -not -path "./.git/*" \
            -not -path "./dist/*" \
            -exec cp -v {} dist/ \;

          echo "Conteúdo de dist:"
          ls -lah dist
